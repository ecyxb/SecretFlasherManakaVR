[01 Core - 核心启动]

## Enable the SteamVR/OpenVR runtime. If initialization fails, the plugin logs the error and leaves the normal game running.
# Setting type: Boolean
# Default value: true
EnableVR = true

## Allow the runtime layer to ask OpenVR to start SteamVR if it is not already running.
# Setting type: Boolean
# Default value: true
AutoStartSteamVR = true

[02 Stereo Rendering - 立体渲染]

## Additional vertical offset in Unity world units applied to the VR camera rig.
# Setting type: Single
# Default value: 0
# Acceptable value range: From -5 to 5
CameraHeightOffset = 0

## Render scene mirrors by letting the original MirrorManager prepare cameras/materials, then rendering those cameras from VRMod's controlled loop.
# Setting type: Boolean
# Default value: true
EnableVrMirrorRenderer = true

## Render each scene mirror once every N frames per eye. Keep this at 1 for stable VR mirrors.
# Setting type: Int32
# Default value: 1
# Acceptable value range: From 1 to 30
VrMirrorUpdateIntervalFrames = 1

## Maximum number of scene mirrors rendered in a single VR frame.
# Setting type: Int32
# Default value: 1
# Acceptable value range: From 1 to 4
VrMirrorMaxUpdatesPerFrame = 1

## Maximum distance from the HMD to a mirror before VRMod stops updating it. Set 0 to disable distance culling.
# Setting type: Single
# Default value: 12
# Acceptable value range: From 0 to 100
VrMirrorMaxDistance = 12

## Scale applied to the OpenVR recommended eye texture size. Lower values are safer while stabilizing the injected renderer.
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0.25 to 1.5
RenderScale = 0.5

## Copy whitelisted source-camera post-processing components to the VR eye cameras only when the source camera changes or the scene changes.
# Setting type: Boolean
# Default value: true
EnableVrCameraPostProcessing = true

## Comma-separated full component type names allowed to be copied from the source camera to the VR eye cameras. This is sync-on-source-camera-change / sync-on-scene-change only.
# Setting type: String
# Default value: UB.VignettesPE,UB.ExposuresPE,UB.BleachsBypassPE,UB.VintagesPE
VrCameraPostProcessingWhitelist = UB.VignettesPE,UB.ExposuresPE,UB.BleachsBypassPE,UB.VintagesPE

## Comma-separated PPv2 effect names copied into VRmod-owned filtered PostProcessVolumes. Test one at a time, for example Bloom, then Bloom,ColorGrading. Leave empty to disable PPv2 copying.
# Setting type: String
# Default value: 
VrPp2EffectWhitelist = 

## Unity layer used internally for VRmod-owned filtered PPv2 volumes. Use an otherwise unused layer.
# Setting type: Int32
# Default value: 30
# Acceptable value range: From 0 to 31
VrPp2VolumeLayer = 30


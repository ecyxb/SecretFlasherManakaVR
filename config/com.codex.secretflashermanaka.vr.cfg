## SecretFlasherManaka VR 配置 / SecretFlasherManaka VR config
## Plugin GUID: com.codex.secretflashermanaka.vr

[01 Core - 核心启动]

## 是否启用 SteamVR/OpenVR 运行时。关闭后游戏按普通模式运行。
## Enables the SteamVR/OpenVR runtime. Disable this to run the game normally.
EnableVR = true

## 是否允许插件在需要时启动 SteamVR。
## Allows the plugin to start SteamVR when needed.
AutoStartSteamVR = true

## 桌面窗口显示内容。可选：MainCamera、LeftEye、RightEye、Disabled。
## Controls what the desktop mirror window shows. Options: MainCamera, LeftEye, RightEye, Disabled.
MirrorMode = MainCamera

[02 Stereo Rendering - 立体渲染]

## IPD 瞳距倍率。只影响双眼间距。
## Multiplier for headset eye separation. This only affects stereo eye spacing.
IPDScale = 1

## OpenVR 米制单位到 Unity 世界单位的倍率。
## Multiplier converting OpenVR meters to Unity world units.
WorldScale = 1

## VR 相机整体高度偏移，单位为 Unity 世界单位。
## Vertical offset applied to the VR camera rig, in Unity world units.
CameraHeightOffset = 0

## 游戏相机旋转作为 VR 基准的方式。推荐 SourceYawOnly。
## Chooses how the game camera rotation is used as the VR base. SourceYawOnly is recommended.
SourceRotationMode = SourceYawOnly

## 眼部渲染分辨率倍率。越低越稳，越高越清晰。
## Scale for eye render resolution. Lower is safer; higher is sharper.
RenderScale = 0.5

## 是否使用 OpenVR 提供的双眼投影矩阵。
## Uses OpenVR eye projection matrices for stereo rendering.
UseOpenVRProjection = true

## OpenVR 投影矩阵转换模式。画面消失或翻转时再尝试其他值。
## OpenVR projection conversion mode. Try other values if the image disappears or flips.
OpenVRProjectionMode = RawSwapVertical

## 是否用游戏源相机投影做 Unity 剔除，避免非对称眼投影导致物体被裁掉。
## Uses the game source camera projection for Unity culling to avoid objects being clipped by asymmetric eye frustums.
UseSourceProjectionForCulling = true

## 提交给 OpenVR 时是否翻转 V 坐标。D3D 路径通常需要开启。
## Flips V coordinates when submitting to OpenVR. Usually needed on the D3D path.
FlipSubmitV = true

[03 Input - 输入]

## 键盘重置视角按键。Quest 手柄 L3 也会触发重置。
## Keyboard key for recentering. Quest controller L3 also triggers recenter.
RecenteringKey = F12

## 第一次拿到有效 HMD 姿态时是否自动重置视角。
## Automatically recenters when the first valid HMD pose is received.
AutoRecenterOnStart = true

## VR 激活时是否屏蔽传统 Mouse X/Y 视角输入。
## Suppresses legacy Mouse X/Y look input while VR is active.
SuppressMouseLookInput = true

## 是否启用 Quest 3 手柄映射。
## Enables Quest 3 controller mapping.
EnableQuest3InputMapping = true

## SteamVR action manifest 绝对路径。留空则使用插件自带 actions.json。
## Absolute path to the SteamVR action manifest. Leave empty to use the bundled actions.json.
Quest3InputActionManifestPath =

## Quest 3 输入状态机的长按判定秒数。
## Long-press threshold, in seconds, for the Quest 3 input state machine.
Quest3LongPressSeconds = 0.5

## 光标模式右摇杆死区。
## Right-stick deadzone used in cursor mode.
Quest3RightStickDeadzone = 0.35

## 光标模式右摇杆对角线保护角度。
## Diagonal guard angle for the right stick in cursor mode.
Quest3RightStickDiagonalGuardDegrees = 15

## Quest 3 扳机模拟按键的按下阈值。
## Analog trigger value treated as a Quest 3 button press.
Quest3TriggerPressThreshold = 0.35

## 光标射线使用的手柄本地方向。可选：Forward、Back、Up、Down、Right、Left。
## Controller-local direction used by the cursor ray. Options: Forward, Back, Up, Down, Right, Left.
Quest3CursorRayDirection = Forward

## 光标射线显示长度。
## Visible length of the cursor ray.
Quest3CursorRayLength = 6

## 光标射线俯仰修正角度。
## Extra pitch correction for the cursor ray, in degrees.
Quest3CursorRayPitchOffsetDegrees = 0

## 光标射线偏航修正角度。
## Extra yaw correction for the cursor ray, in degrees.
Quest3CursorRayYawOffsetDegrees = 0

## 光标射线滚转修正角度。
## Extra roll correction for the cursor ray, in degrees.
Quest3CursorRayRollOffsetDegrees = 0

[04 Body And View - 身体与视角]

## 是否把 HMD 相对旋转应用到玩家胸/颈/头骨骼。
## Applies HMD-relative rotation to the player chest, neck, and head bones.
EnablePlayerHeadPoseControl = true

## 源相机距离第一人称目标多近时启用头部姿态控制。
## Maximum source-camera distance from the first-person target before head pose control activates.
PlayerHeadPoseFollowDistance = 0.75

## HMD 左右转头应用到身体骨骼的最大角度。
## Maximum HMD yaw applied to the body rig, in degrees.
PlayerHeadPoseYawLimitDegrees = 70

## HMD 上下抬头低头应用到身体骨骼的最大角度。
## Maximum HMD pitch applied to the body rig, in degrees.
PlayerHeadPosePitchLimitDegrees = 55

## HMD 侧倾应用到头部的最大角度。
## Maximum HMD roll applied to the head, in degrees.
PlayerHeadPoseRollLimitDegrees = 20

## 移动时是否让 HMD 朝向带动玩家身体转向。
## Lets HMD facing direction turn the player body while the player is moving.
PlayerHeadPoseYawTurnsBodyWhileMoving = true

## HMD 带动身体转向时的最大转向速度，单位为度/秒。
## Maximum body turn speed driven by HMD yaw, in degrees per second.
PlayerHeadPoseBodyYawTurnSpeedDegreesPerSecond = 180

## 是否限制 HMD 位置位移，只保留小范围探头效果。
## Clamps HMD positional movement so only a small lean effect remains.
IgnoreHeadPositionForVrCamera = true

## HMD 本地 X 位移最小值。
## Minimum local HMD X offset applied to the VR camera.
HeadPositionCameraOffsetMinX = -0.05

## HMD 本地 X 位移最大值。
## Maximum local HMD X offset applied to the VR camera.
HeadPositionCameraOffsetMaxX = 0.05

## HMD 本地 Y 位移最小值。
## Minimum local HMD Y offset applied to the VR camera.
HeadPositionCameraOffsetMinY = -0.05

## HMD 本地 Y 位移最大值。
## Maximum local HMD Y offset applied to the VR camera.
HeadPositionCameraOffsetMaxY = 0.05

## HMD 本地 Z 位移最小值。
## Minimum local HMD Z offset applied to the VR camera.
HeadPositionCameraOffsetMinZ = -0.05

## HMD 本地 Z 位移最大值。
## Maximum local HMD Z offset applied to the VR camera.
HeadPositionCameraOffsetMaxZ = 0.05

## HMD 旋转分配到胸部的权重。
## Fraction of HMD rotation assigned to the chest.
PlayerHeadPoseChestWeight = 0.15

## HMD 旋转分配到颈部的权重。
## Fraction of HMD rotation assigned to the neck.
PlayerHeadPoseNeckWeight = 0.3

## HMD 旋转分配到头部的权重。
## Fraction of HMD rotation assigned to the head.
PlayerHeadPoseHeadWeight = 0.55

## HMD 到身体骨骼旋转的平滑速度。
## Smoothing speed for HMD-to-body bone rotation.
PlayerHeadPoseSmoothFactor = 18

[05 VR UI Panel - VR界面面板]

## 是否启用 VR UI 捕获和显示。
## Enables VR UI capture and display.
EnableVrUiBridge = true

## 是否把屏幕空间 UI 捕获到 VR 面板。
## Captures supported screen-space UI into a VR panel.
ConvertOverlayCanvasToWorldSpace = true

## UI 跟随方式。可选：HeadLocked、SourceCameraLocked、WorldFixed。
## UI follow mode. Options: HeadLocked, SourceCameraLocked, WorldFixed.
VrUiFollowMode = HeadLocked

## UI 面板距离头显或源相机的距离。
## Distance from the headset or source camera to the UI panel.
VrUiDistance = 1.4

## UI 面板垂直偏移。
## Vertical offset for the UI panel.
VrUiVerticalOffset = -0.1

## UI 面板整体尺寸倍率。
## Overall scale multiplier for the UI panel.
VrUiPanelScale = 1.08

## UI 面板在捕获纹理里的纵向像素偏移。
## Vertical pixel offset inside the captured UI texture.
VrUiPanelPixelOffsetY = -150

## HUD 右侧状态信息横向像素偏移。
## Horizontal pixel offset for the HUD right-side StatusInfo block.
VrUiStatusInfoOffsetX = -250

## HUD 右侧状态信息纵向像素偏移。
## Vertical pixel offset for the HUD right-side StatusInfo block.
VrUiStatusInfoOffsetY = 150

## 是否把全屏遮罩/特效分离到独立 VR 覆盖层。
## Separates fullscreen masks/effects into an independent VR overlay layer.
EnableVrFullscreenEffectLayer = true

## 全屏特效覆盖层尺寸倍率。
## Scale multiplier for the fullscreen effect overlay.
VrFullscreenEffectPanelScale = 2.7

## 全屏特效覆盖层水平弯曲角度。
## Horizontal curvature angle for the fullscreen effect overlay, in degrees.
VrFullscreenEffectCurveDegrees = 36

## 全屏特效覆盖层深度偏移。
## Depth offset for the fullscreen effect overlay.
VrFullscreenEffectDepthOffset = 0.01

## HUD 脸部 RenderTexture 横向像素偏移。
## Horizontal pixel offset for the HUD face RenderTexture image.
VrUiFaceRtOffsetX = -100

## HUD 脸部 RenderTexture 纵向像素偏移。
## Vertical pixel offset for the HUD face RenderTexture image.
VrUiFaceRtOffsetY = 300

## HUD 脸部 RenderTexture 缩放倍率。
## Scale multiplier for the HUD face RenderTexture image.
VrUiFaceRtScale = 1

## HUD 身体 RenderTexture 横向像素偏移。
## Horizontal pixel offset for the HUD body RenderTexture image.
VrUiBodyRtOffsetX = 100

## HUD 身体 RenderTexture 纵向像素偏移。
## Vertical pixel offset for the HUD body RenderTexture image.
VrUiBodyRtOffsetY = 0

## HUD 身体 RenderTexture 缩放倍率。
## Scale multiplier for the HUD body RenderTexture image.
VrUiBodyRtScale = 1

## UI Canvas 重新扫描间隔，单位秒。
## Interval between UI canvas rescans, in seconds.
VrUiMaxScanInterval = 1

## 只捕获名称包含这些关键词的 Canvas，逗号分隔。留空为自动模式。
## Comma-separated canvas name keywords to capture. Leave empty for automatic mode.
VrUiCanvasNameWhitelist =

## 不捕获名称包含这些关键词的 Canvas，逗号分隔。
## Comma-separated canvas name keywords to exclude from capture.
VrUiCanvasNameBlacklist =

[06 NPC UI - NPC标记界面]

## 是否把 NPC 头顶标记按 HMD 姿态重投影。
## Reprojects NPC overhead markers using the HMD pose.
FixNpcWorldSpaceUi = true

## NPC 标记在头顶的额外高度。
## Extra height above the NPC head for the marker.
NpcWorldSpaceUiVerticalOffset = 0.25

## NPC 标记世界空间缩放。
## World-space scale for NPC markers.
NpcWorldSpaceUiScale = 0.0015

## NPC 标记距离缩放的最近参考距离。
## Nearest reference distance for NPC marker distance scaling.
NpcWorldSpaceUiMinScaleDistance = 3

## NPC 标记距离缩放的最远参考距离。
## Farthest reference distance for NPC marker distance scaling.
NpcWorldSpaceUiMaxScaleDistance = 7

[07 Compatibility - 兼容性]

## 场景切换后暂停 VR 眼渲染的秒数，给反射/镜面对象清理留时间。
## Seconds to pause VR eye rendering after scene transitions while reflection/mirror objects are sanitized.
SceneTransitionVrPauseSeconds = 1.5

## 是否压制 BlackCensorController.OnChange 的重复空引用异常。
## Suppresses repeated NullReferenceException throws from BlackCensorController.OnChange.
SuppressBlackCensorOnChangeNullRefs = true

## 是否禁用游戏源相机组件，只把它作为 VR 眼相机的参数模板。
## Disables the game source camera component and uses it only as a settings template for VR eye cameras.
DisableSourceCameraRendering = false

## 是否禁用 AkilliMum MirrorManager，避免镜面渲染递归。
## Disables AkilliMum MirrorManager while VR is active to avoid recursive mirror rendering.
DisableMirrorManagersWhileVrActive = true

## 是否把渲染到 RenderTexture 的非源相机视为反射/镜面相机。
## Treats non-source cameras that render to RenderTexture as reflection/mirror cameras.
DisableTargetTextureCameras = true

## VR 激活时是否阻止脚本重新启用反射相机、反射探针或 MirrorManager。
## Prevents scripts from re-enabling reflection cameras, reflection probes, or MirrorManager while VR is active.
PreventReflectionReenableWhileVrActive = true

## VR 激活时是否阻止可疑反射相机手动 Camera.Render。
## Blocks manual Camera.Render calls from likely reflection cameras while VR is active.
BlockReflectionCameraRenderWhileVrActive = true

## VR 眼渲染期间是否阻止嵌套的非 VR 眼 Camera.Render。
## Blocks nested non-VR-eye Camera.Render calls during VR eye rendering.
BlockNestedCameraRenderDuringVrRender = true

## 是否禁用 ReflectionProbe。遇到夜晚/反射探针卡顿时再开启。
## Disables ReflectionProbe components. Enable this only if night scenes or reflection probes stall.
DisableReflectionProbes = false

## 判断镜面/反射相机名称的关键词，逗号分隔。
## Comma-separated keywords used to identify mirror/reflection camera names.
ReflectionCameraNameKeywords = mirror,reflect,reflection,planar,water

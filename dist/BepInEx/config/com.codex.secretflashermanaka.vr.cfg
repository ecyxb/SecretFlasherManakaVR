## Settings file was created by plugin SecretFlasherManaka VR v0.1.0
## Plugin GUID: com.codex.secretflashermanaka.vr

[01 Core - 核心启动]

## Enable the SteamVR/OpenVR runtime. If initialization fails, the plugin logs the error and leaves the normal game running.
# Setting type: Boolean
# Default value: true
EnableVR = true

## Allow the runtime layer to ask OpenVR to start SteamVR if it is not already running.
# Setting type: Boolean
# Default value: true
AutoStartSteamVR = true

[02 Stereo Rendering - 立体渲染]

## Additional vertical offset in Unity world units applied to the VR camera rig.
# Setting type: Single
# Default value: 0
# Acceptable value range: From -5 to 5
CameraHeightOffset = 0.05

## Render scene mirrors by letting the original MirrorManager prepare cameras/materials, then rendering those cameras from VRMod's controlled loop.
# Setting type: Boolean
# Default value: true
EnableVrMirrorRenderer = true

## Render each scene mirror once every N frames per eye. Keep this at 1 for stable VR mirrors.
# Setting type: Int32
# Default value: 1
# Acceptable value range: From 1 to 30
VrMirrorUpdateIntervalFrames = 1

## Maximum number of scene mirrors rendered in a single VR frame.
# Setting type: Int32
# Default value: 1
# Acceptable value range: From 1 to 4
VrMirrorMaxUpdatesPerFrame = 1

## Maximum distance from the HMD to a mirror before VRMod stops updating it. Set 0 to disable distance culling.
# Setting type: Single
# Default value: 12
# Acceptable value range: From 0 to 100
VrMirrorMaxDistance = 12

## Scale applied to the OpenVR recommended eye texture size. Lower values are safer while stabilizing the injected renderer.
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0.25 to 1.5
RenderScale = 1

## Copy whitelisted source-camera post-processing components to the VR eye cameras only when the source camera changes or the scene changes.
# Setting type: Boolean
# Default value: true
EnableVrCameraPostProcessing = true

## Comma-separated full component type names allowed to be copied from the source camera to the VR eye cameras. This is sync-on-source-camera-change / sync-on-scene-change only.
# Setting type: String
# Default value: UB.VignettesPE,UB.ExposuresPE,UB.BleachsBypassPE,UB.VintagesPE
VrCameraPostProcessingWhitelist = UB.VignettesPE,UB.ExposuresPE,UB.BleachsBypassPE,UB.VintagesPE

## Comma-separated PPv2 effect names copied into VRmod-owned filtered PostProcessVolumes. Test one at a time, for example Bloom, then Bloom,ColorGrading. Leave empty to disable PPv2 copying.
# Setting type: String
# Default value: 
VrPp2EffectWhitelist = Bloom,ColorGrading,AmbientOcclusion

## Unity layer used internally for VRmod-owned filtered PPv2 volumes. Use an otherwise unused layer.
# Setting type: Int32
# Default value: 30
# Acceptable value range: From 0 to 31
VrPp2VolumeLayer = 30

[03 Input - 输入]

## Keyboard key used to recenter the current HMD forward direction.
# Setting type: KeyCode
RecenteringKey = F12

## Enable Quest 3 controller mapping through SteamVR/OpenVR input. Disable to leave the game's original input untouched.
# Setting type: Boolean
# Default value: true
EnableQuest3InputMapping = true

## Deadzone for cursor-mode right-stick Q/E/scroll mapping.
# Setting type: Single
# Default value: 0.35
# Acceptable value range: From 0 to 0.95
Quest3RightStickDeadzone = 0.35

[04 Body And View - 身体与视角]

## While VR is active and the game camera is attached to the first-person player camera target, add HMD-relative rotation to the player head/neck/chest bones.
# Setting type: Boolean
# Default value: true
EnablePlayerHeadPoseControl = true

## Maximum distance from the source camera to the player's first-person camera target for HMD head pose control to activate. GameOver detached cameras should exceed this.
# Setting type: Single
# Default value: 0.75
# Acceptable value range: From 0.05 to 3
PlayerHeadPoseFollowDistance = 0.75

## Maximum left/right HMD yaw applied to the player body rig.
# Setting type: Single
# Default value: 70
# Acceptable value range: From 0 to 120
PlayerHeadPoseYawLimitDegrees = 70

## Maximum up/down HMD pitch applied to the player body rig.
# Setting type: Single
# Default value: 55
# Acceptable value range: From 0 to 90
PlayerHeadPosePitchLimitDegrees = 55

## Maximum HMD roll applied to the player head. Keep this small to avoid exaggerated sideways head tilt.
# Setting type: Single
# Default value: 20
# Acceptable value range: From 0 to 45
PlayerHeadPoseRollLimitDegrees = 20

## When enabled, HMD yaw keeps driving head bones while standing still, but turns the player's body toward the HMD facing direction while the game reports actual player movement.
# Setting type: Boolean
# Default value: true
PlayerHeadPoseYawTurnsBodyWhileMoving = true

## Maximum degrees per second used when HMD yaw turns the player body while moving. The consumed HMD yaw is matched to the actual interpolated body yaw step.
# Setting type: Single
# Default value: 180
# Acceptable value range: From 0 to 1080
PlayerHeadPoseBodyYawTurnSpeedDegreesPerSecond = 180

## When enabled, HMD positional movement is clamped before it is added to the VR camera. HMD rotation, IPD, and player head bone control still apply.
# Setting type: Boolean
# Default value: true
IgnoreHeadPositionForVrCamera = true

## Minimum local X HMD positional offset applied to the VR camera when IgnoreHeadPositionForVrCamera is enabled.
# Setting type: Single
# Default value: -1
# Acceptable value range: From -10 to 10
HeadPositionCameraOffsetMinX = -0.6

## Maximum local X HMD positional offset applied to the VR camera when IgnoreHeadPositionForVrCamera is enabled.
# Setting type: Single
# Default value: 1
# Acceptable value range: From -10 to 10
HeadPositionCameraOffsetMaxX = 0.6

## Minimum local Y HMD positional offset applied to the VR camera when IgnoreHeadPositionForVrCamera is enabled.
# Setting type: Single
# Default value: -1
# Acceptable value range: From -10 to 10
HeadPositionCameraOffsetMinY = -0.15

## Maximum local Y HMD positional offset applied to the VR camera when IgnoreHeadPositionForVrCamera is enabled.
# Setting type: Single
# Default value: 1
# Acceptable value range: From -10 to 10
HeadPositionCameraOffsetMaxY = 0.2

## Minimum local Z HMD positional offset applied to the VR camera when IgnoreHeadPositionForVrCamera is enabled.
# Setting type: Single
# Default value: -1
# Acceptable value range: From -10 to 10
HeadPositionCameraOffsetMinZ = -0.4

## Maximum local Z HMD positional offset applied to the VR camera when IgnoreHeadPositionForVrCamera is enabled.
# Setting type: Single
# Default value: 1
# Acceptable value range: From -10 to 10
HeadPositionCameraOffsetMaxZ = 0.4

## Smoothing speed for the source camera base position before HMD pose is applied. Higher values follow faster; 0 disables position smoothing.
# Setting type: Single
# Default value: 18
# Acceptable value range: From 0 to 120
VrCameraBasePositionSmoothFactor = 18

## Smoothing speed for the source camera base rotation/yaw before HMD pose is applied. Higher values follow faster; 0 disables rotation smoothing.
# Setting type: Single
# Default value: 24
# Acceptable value range: From 0 to 120
VrCameraBaseRotationSmoothFactor = 24

## Fraction of the limited HMD rotation added to the chest.
# Setting type: Single
# Default value: 0.15
# Acceptable value range: From 0 to 1
PlayerHeadPoseChestWeight = 0.15

## Fraction of the limited HMD rotation added to the neck.
# Setting type: Single
# Default value: 0.3
# Acceptable value range: From 0 to 1
PlayerHeadPoseNeckWeight = 0.3

## Fraction of the limited HMD rotation added to the head.
# Setting type: Single
# Default value: 0.55
# Acceptable value range: From 0 to 1
PlayerHeadPoseHeadWeight = 0.55

## Smoothing speed for HMD-to-body head rotation. Higher values follow faster.
# Setting type: Single
# Default value: 18
# Acceptable value range: From 0 to 60
PlayerHeadPoseSmoothFactor = 18

## When enabled, hide neck-weighted triangles from the player body mesh while VR first-person head pose control is active.
# Setting type: Boolean
# Default value: true
HidePlayerNeckInVrFirstPerson = true


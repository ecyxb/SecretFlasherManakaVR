## Long-press threshold used by the Quest 3 input state machine.
# Setting type: Single
# Default value: 0.5
# Acceptable value range: From 0.1 to 2
Quest3LongPressSeconds = 0.5

## Deadzone for cursor-mode right-stick Q/E/scroll mapping.
# Setting type: Single
# Default value: 0.35
# Acceptable value range: From 0 to 0.95
Quest3RightStickDeadzone = 0.35

## Invalid angle around right-stick diagonals in cursor mode.
# Setting type: Single
# Default value: 15
# Acceptable value range: From 0 to 40
Quest3RightStickDiagonalGuardDegrees = 15

## Analog Quest 3 trigger pull value treated as a button press.

## SecretFlasherManaka Ring Menu Long Press 配置 / SecretFlasherManaka Ring Menu Long Press config
## Plugin GUID: com.codex.secretflashermanaka.ringmenulongpress

[RingMenu - 环形菜单]

## 是否启用环形菜单长按阈值替换。
## Enables replacing the ring-menu-only long-press threshold.
EnablePatch = true

## 传给 RingMenuParentView 的 InputManager.GetLongDown 长按计数。原版环形菜单为 10，原版通用长按为 20；数值越大越不容易误开环形菜单。
## Long-press count passed to InputManager.GetLongDown for RingMenuParentView. Vanilla ring menu uses 10, and vanilla generic long-press uses 20; larger values make accidental ring-menu opens less likely.
RingMenuLongPressCount = 20
